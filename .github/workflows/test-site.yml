name: site regression tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/test-site.yml"
  push:
    paths:
      - "site/**"
      - ".github/workflows/test-site.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run site regression tests
        run: python3 -m unittest discover -s site -p 'test_*.py' -v
      - name: Build today's page
        run: python3 site/generate.py
